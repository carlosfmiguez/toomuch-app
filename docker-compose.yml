services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: toomuch
      POSTGRES_USER: toomuch
      POSTGRES_PASSWORD: toomuch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toomuch"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://toomuch:toomuch@db:5432/toomuch
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
