name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências do sistema (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - run: pip install -r requirements.txt
      - run: python scripts/compile_messages.py
      - name: Testes
        env:
          SECRET_KEY: ci
          DEBUG: "False"
        run: python manage.py test --verbosity 1
